name = "jokeshovel"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# The SPA build is served as static assets. Only /api/* runs the Worker first;
# every other unknown path falls back to index.html for client-side routing.
[assets]
directory = "../apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

# Local defaults. Production values are passed by .github/workflows/deploy.yml
# (`wrangler deploy --var ...`); secrets are set with `wrangler secret put`.
# Override locally in worker/.dev.vars (see .dev.vars.example).
[vars]
SUPABASE_URL = "http://127.0.0.1:54321"
SUPABASE_ANON_KEY = ""
APP_BASE_URL = "http://localhost:8787"
# Google Docs Joke Book (Phase 4). Stays off until the Google OAuth client and
# the secrets in docs/RUNBOOK.md ("Google Docs Joke Book") are set up.
FEATURE_DOCS_SYNC = "false"

# Per-user rate limits (docs/DESIGN.md §10.10). namespace_id is any number
# unique within the Cloudflare account; nothing needs creating first.
[[ratelimits]]
name = "PUBLISH_LIMITER"
namespace_id = "41001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "INTEGRATION_LIMITER"
namespace_id = "41002"
simple = { limit = 5, period = 60 }
